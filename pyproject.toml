[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "word-art"
version = "0.1.0"
description = "A program made for showing a selected image using custom text."
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Caio Luiz Hermann (Kyoto)", email = "caio_luiz_hermann@hotmail.com" }
]
dependencies = [
    "requests",
    "colorama>=0.4",
]

[project.scripts]
meu-comando = "meu_pacote.arquivo:funcao_principal"